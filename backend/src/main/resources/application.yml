server:
  port: ${BACKEND_PORT:8080}
  shutdown: graceful
  error:
    include-message: never

spring:
  application:
    name: entra-sso-backend
  profiles:
    default: entra
  main:
    banner-mode: off
  lifecycle:
    timeout-per-shutdown-phase: 30s
app:
  security:
    required-scope: access_as_user
    allowed-origins:
      - "${UI_ORIGIN:http://localhost:5173}"
    role-functionalities:
      APP_USER:
        - DASHBOARD_VIEW
      APP_MANAGER:
        - DASHBOARD_VIEW
        - REPORTS_VIEW
      APP_ADMIN:
        - DASHBOARD_VIEW
        - REPORTS_VIEW
        - ADMIN_USERS_VIEW

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
