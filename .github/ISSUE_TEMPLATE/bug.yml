name: Bug report
description: Report a reproducible defect without including credentials or personal data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste an access token, client secret, real tenant ID, or personal information.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps using redacted or fictional identifiers.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive-data check
      options:
        - label: I removed tokens, credentials, tenant identifiers, and personal data.
          required: true

